<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>♚ Chess Arcade</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth" class="screen"><div class="card"><h1>♚ CHESS ARCADE ♚</h1><p>Play offline, vs computer, or online.</p><div class="tabs"><button id="lt">LOGIN</button><button id="rt">NEW PLAYER</button></div><form id="lf"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Password" required><button class="primary">LOGIN</button></form><form id="rf" class="hidden"><input id="rn" placeholder="Player name" maxlength="80" required><input id="re" type="email" placeholder="Email" required><input id="rp" type="password" placeholder="Password (8+ characters)" minlength="8" required><input id="rc" type="password" placeholder="Confirm password" minlength="8" required><label>Birth date<input id="rd" type="date" required></label><button class="primary">CREATE ACCOUNT</button></form><div id="am"></div></div></div>
<div id="menu" class="screen hidden"><div class="card"><div class="bar"><b id="welcome"></b><b>♚ <span id="coins">0</span></b></div><h1>♚ CHESS ARCADE ♚</h1><button class="mode primary" data-mode="offline">PLAY OFFLINE</button><button class="mode" data-mode="computer">PLAY WITH COMPUTER</button><button class="mode" data-mode="online">PLAY ONLINE</button><button id="profile">PROFILE & BOARD STORE</button><button id="logout">LOG OUT</button></div></div>
<div id="colour" class="screen hidden"><div class="card"><h2>Choose your colour</h2><button class="col primary" data-c="white">PLAY AS WHITE</button><button class="col" data-c="black">PLAY AS BLACK</button><button class="col" data-c="random">RANDOM COLOUR</button><button id="back">BACK</button></div></div>
<div id="prof" class="screen hidden"><div class="card"><h2>PLAYER PROFILE</h2><div id="pi"></div><h2>BOARD STORE</h2><div id="store"></div><button id="pb">BACK</button></div></div>
<div id="game" class="hidden"><header><b>♚ CHESS ARCADE</b><span>♚ <span id="gcoins">0</span> <button id="exit">EXIT</button></span></header><main><section><div id="status"></div><div id="board"></div></section><aside><div class="box"><h3>GAME</h3><div id="players"></div></div><div class="box"><h3>CAPTURED PIECES</h3><small>White pieces lost</small><div id="cw"></div><small>Black pieces lost</small><div id="cb"></div></div><div class="box"><h3>REWARDS</h3><div>Win: +20 ♚</div><div>Draw: +5 ♚</div></div></aside></main></div>
<script type="module" src="/static/app.js"></script></body></html>
