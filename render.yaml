services:
  - type: web
    name: chess-arcade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chess-arcade-db
          property: connectionString

databases:
  - name: chess-arcade-db
    plan: free
